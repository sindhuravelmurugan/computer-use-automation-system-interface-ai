{% extends "base.html" %}
{% block title %}Page not available{% endblock %}
{% block content %}

<table class="pnl" cellpadding="0" cellspacing="0" border="0" width="640">
  <tr>
    <td class="c4" style="background:#7a1f1f;color:#fff;padding:6px 10px;">
      <h1 id="ctl00_ContentMain_lblNotAvailableTitle" class="hd1"
          style="margin:0;font-size:14px;font-weight:bold;">Page not available</h1>
    </td>
  </tr>
  <tr>
    <td class="c2" style="border:1px solid #9a9a90;padding:12px;">
      <div id="ctl00_ContentMain_pnlNotAvailable" class="alrt" role="alert">
        The requested screen does not exist in this console.
      </div>
      <p class="c9" style="margin:12px 0 0 0;">
        <a id="ctl00_ContentMain_lnkBackToSearch" href="{{ url_for('members.search') }}">Return to search</a>
      </p>
    </td>
  </tr>
</table>

{% endblock %}
