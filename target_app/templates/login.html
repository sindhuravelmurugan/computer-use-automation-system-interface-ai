{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}

<table class="pnl" cellpadding="0" cellspacing="0" border="0" width="520">
  <tr>
    <td class="c4" style="background:{{ tenant.accent_color }};color:#fff;padding:6px 10px;">
      <span id="ctl00_ContentMain_lblLoginTitle">Sign in</span>
    </td>
  </tr>
  <tr>
    <td class="c2" style="border:1px solid #9a9a90;padding:12px;">

      {% if expired %}
      <div id="ctl00_ContentMain_pnlExpired" class="alrt" role="alert" style="margin-bottom:10px;">
        Your session has expired. Please sign in again.
      </div>
      {% endif %}

      {% if error %}
      <div id="ctl00_ContentMain_pnlLoginError" class="alrt" role="alert" style="margin-bottom:10px;">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="{{ url_for('auth.do_login') }}">
        <table cellpadding="4" cellspacing="0" border="0">
          <tr>
            <td class="c3"><label for="ctl00_ContentMain_txtUserName">User name</label></td>
            <td class="c3">
              <input type="text" id="ctl00_ContentMain_txtUserName" name="username"
                     class="f2" size="28" autocomplete="off">
            </td>
          </tr>
          <tr>
            <td class="c3"><label for="ctl00_ContentMain_txtPassword">Password</label></td>
            <td class="c3">
              <input type="password" id="ctl00_ContentMain_txtPassword" name="password"
                     class="f2" size="28" autocomplete="off">
            </td>
          </tr>
          <tr>
            <td class="c3"></td>
            <td class="c3">
              <input type="submit" id="ctl00_ContentMain_btnSignIn" name="ctl00$ContentMain$btnSignIn"
                     class="btn" value="Sign In">
            </td>
          </tr>
        </table>
      </form>

    </td>
  </tr>
</table>

{% endblock %}
