{% extends "base.html" %}
{% block title %}Session step out of sequence{% endblock %}
{% block content %}

<table class="pnl" cellpadding="0" cellspacing="0" border="0" width="640">
  <tr>
    <td class="c4" style="background:#7a1f1f;color:#fff;padding:6px 10px;">
      <h1 id="ctl00_ContentMain_lblStageErrorTitle" class="hd1"
          style="margin:0;font-size:14px;font-weight:bold;">Step out of sequence</h1>
    </td>
  </tr>
  <tr>
    <td class="c2" style="border:1px solid #9a9a90;padding:12px;">
      <div id="ctl00_ContentMain_pnlStageError" class="alrt" role="alert">
        This request did not follow the review step, or it was already submitted.
        Nothing has been changed.
      </div>
      <p class="c9" style="margin:12px 0 0 0;">
        <a id="ctl00_ContentMain_lnkRestartSubAccount"
           href="{{ url_for('members.subaccount_new', member_id=member.id) }}">Start again</a>
      </p>
    </td>
  </tr>
</table>

{% endblock %}
