[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use-automation-system-interface-ai"
version = "0.1.0"
description = "An LLM discovers a flow in a legacy, API-less back-office UI once; the run compiles into a typed capability artifact that replays deterministically, with no model in the loop."
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.3",
    "pydantic==2.13.5",
    "playwright==1.62.0",
    "typer==0.27.2",
    "python-dotenv==1.2.3",
    "google-genai==2.22.0",
    "anthropic==1.4.0",
]

# Only the demo path (discover / replay / capabilities / show / operator)
# needs the core dependencies above. Everything here is for running the
# test suite and the live acceptance scripts, not for using the CLI.
[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "requests==2.34.2",
    "pillow==12.3.0",
]

# This repo's own layout: "src" is the package name (not a src-layout root
# holding a differently-named package), alongside the target app and the
# acceptance scripts as their own top-level packages.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "target_app*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
